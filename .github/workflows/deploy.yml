# Deploys the PedalWorks SAM backend (backend/sam-app) to AWS.
#
# Authentication uses GitHub's OIDC provider — no long-lived AWS access keys
# are stored in this repository. To enable deployments you need:
#
#   1. An IAM OIDC identity provider for token.actions.githubusercontent.com
#      (one per AWS account).
#   2. An IAM role whose trust policy allows the GitHub OIDC provider to
#      assume it for this repository (and ideally only the dev branch), with
#      permissions to deploy the stack (CloudFormation, Lambda, API Gateway,
#      DynamoDB, IAM role creation, S3 for the SAM deployment bucket).
#   3. Repository configuration (Settings > Secrets and variables > Actions):
#      - Secret  AWS_ROLE_ARN : ARN of the IAM deploy role from step 2.
#      - Variable AWS_REGION  : AWS region to deploy into.
#        Defaults to us-east-1 (matches samconfig.toml) when not set.
#
# The stack name below matches samconfig.toml so CLI and CI deploys target
# the same CloudFormation stack.

name: Deploy SAM Backend

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/sam-app/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write # required to request the GitHub OIDC token
  contents: read  # required to check out the repository

# Serialize deployments: CloudFormation rejects a stack update while the
# previous one is still in progress, so queue runs instead of overlapping.
concurrency:
  group: deploy-sam-app-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: sam-app

jobs:
  deploy:
    name: Build and deploy SAM app
    runs-on: ubuntu-latest

    steps:
      # Third-party actions are pinned to commit SHAs because this job holds
      # an OIDC token that can assume the AWS deploy role.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2

      - name: Build SAM application
        working-directory: backend/sam-app
        run: sam build

      - name: Deploy SAM application
        working-directory: backend/sam-app
        run: |
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
