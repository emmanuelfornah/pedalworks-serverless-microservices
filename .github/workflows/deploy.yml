# PedalWorks CI/CD
#
# Deploys:
#   1. AWS SAM backend infrastructure
#   2. React/Vite frontend to private S3
#   3. CloudFront cache invalidation
#
# Authentication uses GitHub OIDC.
# No long-lived AWS access keys are stored in GitHub.

name: Deploy PedalWorks

# NOTE: Auto-deploy on push is intentionally disabled.
#
# The live backend is managed by the "pedalworks-fixed" CloudFormation stack,
# which contains more resources than backend/sam-app/template.yaml describes
# (full Orders + Inventory report pipeline, Cognito domain, SNS, Step Functions).
# Deploying this template over that stack would DELETE those live resources, and
# the previous target stack ("sam-app") is stuck in REVIEW_IN_PROGRESS and cannot
# be updated. Until the template is reconciled with the live stack, this workflow
# runs only when triggered manually.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you understand this may modify live infrastructure'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-pedalworks-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # This workflow deploys backend/sam-app/template.yaml as its OWN dedicated
  # stack. It must never target "pedalworks-fixed" (the live stack that owns
  # the full Orders + Inventory pipeline) because this template is a subset and
  # deploying it there would delete those live resources.
  # Override only with another NEW/dedicated stack via the DEPLOY_STACK_NAME var.
  STACK_NAME: ${{ vars.DEPLOY_STACK_NAME || 'pedalworks-app' }}
  PROTECTED_STACK: pedalworks-fixed

jobs:
  deploy:
    name: Build and deploy PedalWorks
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Manual confirmation guard
      # ----------------------------------------------------------

      - name: Confirm intentional deploy
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Deploy not confirmed. Re-run the workflow and type 'deploy' in the confirm input." >&2
            exit 1
          fi
          if [ -z "${STACK_NAME}" ]; then
            echo "STACK_NAME resolved empty. Refusing to deploy to an unknown stack." >&2
            exit 1
          fi
          if [ "${STACK_NAME}" = "${PROTECTED_STACK}" ]; then
            echo "Refusing to deploy this template onto the protected live stack '${PROTECTED_STACK}'." >&2
            echo "This template is a subset of that stack and would delete live resources." >&2
            exit 1
          fi
          echo "Deploy confirmed for stack: ${STACK_NAME}"

      # ----------------------------------------------------------
      # Source
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ----------------------------------------------------------
      # AWS Authentication - GitHub OIDC
      # ----------------------------------------------------------

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Backend - AWS SAM
      # ----------------------------------------------------------

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2

      - name: Build SAM application
        working-directory: backend/sam-app
        run: sam build

      # Preview the CloudFormation change set before applying. This surfaces any
      # resource replacements/deletions in the job log for a safe review trail.
      - name: Preview change set
        working-directory: backend/sam-app
        continue-on-error: true
        run: |
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-execute-changeset \
            --no-fail-on-empty-changeset

      - name: Deploy SAM application
        working-directory: backend/sam-app
        run: |
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Install seed dependencies
        run: pip install boto3

      - name: Seed DynamoDB products
        working-directory: backend/sam-app
        run: python seed_products.py

      # ----------------------------------------------------------
      # Read deployed infrastructure values from CloudFormation
      # ----------------------------------------------------------

      - name: Get deployment outputs
        id: infrastructure
        shell: bash
        run: |
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='MicroserviceApi'].OutputValue" \
            --output text)

          echo "frontend_bucket=${FRONTEND_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${DISTRIBUTION_ID}" >> "$GITHUB_OUTPUT"
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Frontend - React/Vite
      # ----------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bike-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: bike-app
        run: npm ci

      - name: Build React frontend
        working-directory: bike-app
        env:
          VITE_API_GATEWAY_URL: ${{ steps.infrastructure.outputs.api_url }}
          VITE_APP_S3_BUCKET_URL: ${{ vars.VITE_APP_S3_BUCKET_URL }}
        run: npm run build

      # ----------------------------------------------------------
      # Deploy frontend
      # ----------------------------------------------------------

      - name: Upload frontend to S3
        run: |
          aws s3 sync bike-app/dist/ \
            "s3://${{ steps.infrastructure.outputs.frontend_bucket }}/" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infrastructure.outputs.distribution_id }}" \
            --paths "/*"

      # ----------------------------------------------------------
      # Deployment summary
      # ----------------------------------------------------------

      - name: Deployment summary
        run: |
          echo "### PedalWorks Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- SAM backend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- DynamoDB products seeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- React frontend built" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend uploaded to private S3" >> "$GITHUB_STEP_SUMMARY"
          echo "- CloudFront invalidation requested" >> "$GITHUB_STEP_SUMMARY"
